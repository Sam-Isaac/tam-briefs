<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shivani Sharma – TAM Brief · 28 Jul 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fa;--surface:#ffffff;--border:#e2e8f0;--text:#1a202c;--muted:#64748b;--accent:#6366f1;--tag-bg:#f1f5f9;--tag-text:#475569}
[data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#818cf8;--tag-bg:#1e293b;--tag-text:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;justify-content:space-between}
.header-left h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent)}
.header-left .sub{font-size:13px;color:var(--muted);margin-top:2px}
.theme-btn{background:var(--tag-bg);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit}
.main{max-width:960px;margin:0 auto;padding:32px}
.no-calls{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:48px;text-align:center;color:var(--muted)}
.no-calls .icon{font-size:40px;margin-bottom:12px}
.no-calls h2{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px}
.no-calls p{font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>Shivani Sharma — TAM Brief</h1>
    <div class="sub">28 Jul 2026 · Monday · Generated by automated briefing routine</div>
  </div>
  <button class="theme-btn" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Toggle Theme</button>
</div>
<div class="main">
  <div class="no-calls">
    <div class="icon">📅</div>
    <h2>No Customer Calls Today</h2>
    <p>No external customer calls were found on Shivani's calendar for 28 Jul 2026.<br>Have a productive Monday!</p>
  </div>
</div>
</body>
</html>
