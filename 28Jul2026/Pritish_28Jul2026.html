<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pritish Samal – TAM Brief · 28 Jul 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fa;--surface:#ffffff;--border:#e2e8f0;--text:#1a202c;--muted:#64748b;--accent:#6366f1;--red-bg:#fff1f2;--red-border:#fecdd3;--blue-bg:#eff6ff;--blue-border:#bfdbfe;--tag-bg:#f1f5f9;--tag-text:#475569;--critical-bg:#fef3c7;--critical-border:#fde68a}
[data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#818cf8;--red-bg:#1a0a0f;--red-border:#7f1d1d;--blue-bg:#0c1a2e;--blue-border:#1e3a5f;--tag-bg:#1e293b;--tag-text:#94a3b8;--critical-bg:#1c1205;--critical-border:#78350f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;justify-content:space-between}
.header-left h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent)}
.header-left .sub{font-size:13px;color:var(--muted);margin-top:2px}
.theme-btn{background:var(--tag-bg);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit}
.tabs{display:flex;gap:8px;padding:20px 32px 0;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto}
.tab{padding:10px 20px;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;font-weight:500;border:1px solid transparent;border-bottom:none;white-space:nowrap}
.tab.active{background:var(--bg);border-color:var(--border);color:var(--accent);margin-bottom:-1px}
.tab:not(.active){color:var(--muted)}
.tab:not(.active):hover{background:var(--tag-bg)}
.main{max-width:960px;margin:0 auto;padding:32px}
.customer-panel{display:none}
.customer-panel.active{display:block}
.section{margin-bottom:28px}
.section-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:12px}
.call-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;display:flex;align-items:center;gap:16px}
.call-time{font-family:'DM Mono',monospace;font-size:13px;color:var(--accent);font-weight:500;white-space:nowrap}
.call-title{font-size:14px;font-weight:600}
.call-sub{font-size:12px;color:var(--muted);margin-top:2px}
.bucket{margin-bottom:16px}
.bucket-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bucket-label{font-size:13px;font-weight:600}
.bucket-count{font-family:'DM Mono',monospace;font-size:12px;background:var(--tag-bg);color:var(--tag-text);padding:1px 8px;border-radius:10px}
.case-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:6px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.case-card.red{border-left:3px solid #f43f5e;background:var(--red-bg);border-color:var(--red-border)}
.case-card.blue{border-left:3px solid #3b82f6;background:var(--blue-bg);border-color:var(--blue-border)}
.case-card.critical{background:var(--critical-bg);border-color:var(--critical-border);border-left:3px solid #f59e0b}
.case-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.case-subject{font-size:13px;font-weight:500;line-height:1.4;margin:3px 0}
.case-contact{font-size:12px;color:var(--muted)}
.case-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;white-space:nowrap}
.tag{font-family:'DM Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;background:var(--tag-bg);color:var(--tag-text)}
.tag.p1{background:#fee2e2;color:#991b1b}
.tag.p2{background:#fed7aa;color:#9a3412}
.tag.p3{background:#fef9c3;color:#854d0e}
.tag.age-warn{background:#fef3c7;color:#78350f}
.tag.age-crit{background:#fee2e2;color:#991b1b}
.critical-badge{font-size:10px;background:#f59e0b;color:#000;padding:1px 7px;border-radius:4px;font-weight:700;display:inline-block;margin-left:6px}
.action-list{display:flex;flex-direction:column;gap:8px}
.action-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.action-owner{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;padding-top:1px}
.action-text{font-size:13px;line-height:1.5}
.gong-meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.empty-state{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;text-align:center;color:var(--muted);font-size:13px}
.alert-banner{background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:16px;color:#991b1b;font-weight:500}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>Pritish Samal — TAM Brief</h1>
    <div class="sub">28 Jul 2026 · Monday · Generated by automated briefing routine</div>
  </div>
  <button class="theme-btn" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Toggle Theme</button>
</div>
<div class="tabs" id="tabs"></div>
<div class="main" id="main"></div>
<script>
const CUSTOMERS_JSON_ARRAY=[
  {
    id:"statefarm",name:"State Farm",
    call:{time:"~9:30 PM IST",title:"Review Report Information",type:"Review Call"},
    alert:"🚨 CRITICAL: Case 00056238 is 161 days old – RBAC feature ask from Kirsten Feldker. This requires immediate escalation or closure plan.",
    red_cases:[
      {num:"00062305",pri:"P1",status:"Open",age:"20d",contact:"manikandan Elumalai",subject:"Import failed",critical:false},
      {num:"00056238",pri:"P2",status:"Open",age:"161d",contact:"Kirsten Feldker",subject:"Fwd: [EXTERNAL] Testsigma – RBAC Related Feature Asks",critical:true},
      {num:"00062890",pri:"P2",status:"Open",age:"4d",contact:"Linda Broom",subject:"Recorder getting disappeared",critical:false},
      {num:"00062562",pri:"P3",status:"Open",age:"13d",contact:"Shweta Jain",subject:"Runtime-based Update Add-on for Local Agent",critical:false},
      {num:"00061599",pri:"P3",status:"Open",age:"40d",contact:"Jonathan Hamelau",subject:"Copilot and Browser Extension Failure",critical:false}
    ],
    blue_cases:[
      {num:"00062796",pri:"P1",status:"Waiting for Customer",age:"6d",contact:"manikandan Elumalai",subject:"First Iteration buffer is not being cleared in the REST API",critical:false}
    ],
    gong_date:"—",
    actions:[],
    jira:[]
  }
];
function ageClass(a){const d=parseInt(a);if(d>=30)return'age-crit';if(d>=7)return'age-warn';return''}
function renderTabs(){const tabs=document.getElementById('tabs');CUSTOMERS_JSON_ARRAY.forEach((c,i)=>{const t=document.createElement('div');t.className='tab'+(i===0?' active':'');t.textContent=c.name;t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.customer-panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('panel-'+c.id).classList.add('active')};tabs.appendChild(t)})}
function renderPanel(c){
  let html=`<div class="customer-panel${CUSTOMERS_JSON_ARRAY.indexOf(c)===0?' active':''}" id="panel-${c.id}">`;
  if(c.alert){html+=`<div class="alert-banner">${c.alert}</div>`}
  html+=`<div class="section"><div class="section-title">Today's Call</div>`;
  html+=`<div class="call-card"><div class="call-time">${c.call.time}</div><div><div class="call-title">${c.call.title}</div><div class="call-sub">${c.call.type}</div></div></div>`;
  html+=`</div>`;
  html+=`<div class="section"><div class="section-title">Salesforce Cases</div>`;
  if(c.red_cases.length>0){html+=`<div class="bucket"><div class="bucket-header"><span style="color:#e11d48">🔴</span><span class="bucket-label">Waiting on Us</span><span class="bucket-count">${c.red_cases.length}</span></div>`;c.red_cases.forEach(cs=>{const ac=ageClass(cs.age);html+=`<div class="case-card red${cs.critical?' critical':''}"><div><div class="case-num">${cs.num}</div><div class="case-subject">${cs.subject}${cs.critical?'<span class="critical-badge">CRITICAL</span>':''}</div><div class="case-contact">${cs.contact}</div></div><div class="case-meta"><span class="tag ${cs.pri.toLowerCase()}">${cs.pri}</span><span class="tag">${cs.status}</span><span class="tag ${ac}">${cs.age}</span></div></div>`});html+=`</div>`}
  if(c.blue_cases.length>0){html+=`<div class="bucket"><div class="bucket-header"><span style="color:#2563eb">🔵</span><span class="bucket-label">Waiting on Customer</span><span class="bucket-count">${c.blue_cases.length}</span></div>`;c.blue_cases.forEach(cs=>{html+=`<div class="case-card blue"><div><div class="case-num">${cs.num}</div><div class="case-subject">${cs.subject}</div><div class="case-contact">${cs.contact}</div></div><div class="case-meta"><span class="tag ${cs.pri.toLowerCase()}">${cs.pri}</span><span class="tag">${cs.status}</span><span class="tag ${ageClass(cs.age)}">${cs.age}</span></div></div>`});html+=`</div>`}
  html+=`</div>`;
  html+=`<div class="section"><div class="section-title">Gong – Pending Action Items</div><div class="empty-state">No State Farm Gong calls found in last 60 days</div></div>`;
  html+=`</div>`;return html;
}
renderTabs();
const main=document.getElementById('main');
CUSTOMERS_JSON_ARRAY.forEach(c=>{main.innerHTML+=renderPanel(c)});
</script>
</body>
</html>
