<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAM Brief — Nixon Nicholas — 03 Aug 2026</title>
<style>
:root{--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--accent:#4f46e5;--accent-lt:#eef2ff;--warn-bg:#fffbeb;--warn-bd:#fbbf24;--warn-tx:#92400e}
[data-theme=dark]{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#818cf8;--accent-lt:#1e1b4b;--warn-bg:#1c1107;--warn-bd:#92400e;--warn-tx:#fcd34d}
@media(prefers-color-scheme:dark){html:not([data-theme]){--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#818cf8;--accent-lt:#1e1b4b;--warn-bg:#1c1107;--warn-bd:#92400e;--warn-tx:#fcd34d}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
h1{font-size:20px;font-weight:700}
.hd-sub{color:var(--muted);font-size:13px;margin-top:2px}
.btn-theme{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;color:var(--text);font-size:12px;font-family:inherit}
.banner{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.banner-warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx)}
.no-calls{text-align:center;padding:56px 24px;color:var(--muted)}
.no-calls h2{margin-bottom:8px;color:var(--text);font-size:18px}
.no-calls p{font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>TAM Brief — Nixon Nicholas</h1>
      <div class="hd-sub">Monday, 03 August 2026 &middot; Testsigma Daily Brief</div>
    </div>
    <button class="btn-theme" onclick="toggleTheme()">&#9728;&#65039; / &#127769;</button>
  </header>
  <div class="banner banner-warn">&#9888;&#65039; Salesforce data unavailable &mdash; Testsigma-Salesforce connector requires re-authorization. Waiting-on-Us / Waiting-on-Customer data is not shown. Please check your Claude connector settings.</div>
  <div id="app"></div>
</div>
<script>
const CUSTOMERS_JSON_ARRAY = [];

function render(){
  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="no-calls">
      <div style="font-size:56px;margin-bottom:16px">&#127796;</div>
      <h2>No customer calls today</h2>
      <p style="margin-top:8px;max-width:400px;margin-left:auto;margin-right:auto">Nixon has no customer calls scheduled for Monday, 03 August 2026.<br>The Omnex Inc call was declined.<br>Check back tomorrow for your next briefing.</p>
    </div>`;
}

window.toggleTheme=function(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';};
(function(){if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.dataset.theme='dark';})();
render();
</script>
</body>
</html>
