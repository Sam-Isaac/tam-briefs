<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pritish Samal — TAM Brief 10 Aug 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
:root{--bg:#f5f4f0;--bg2:#eceae4;--bg3:#ffffff;--border:#ddd9d0;--text:#1a1916;--text2:#6b6860;--text3:#9b9890;--red:#c94040;--red-bg:#fdf0f0;--blue:#2563eb;--blue-bg:#eff4ff;--green:#16a34a;--green-bg:#f0fdf4;--orange:#d97706;--orange-bg:#fffbeb;--jira:#0052cc;--tag-bg:#e8e6e0;}
@media(prefers-color-scheme:dark){:root{--bg:#111110;--bg2:#1a1917;--bg3:#222220;--border:#2e2d2a;--text:#f0ede8;--text2:#8a8880;--text3:#5a5855;--red:#ef5555;--red-bg:#1f1212;--blue:#60a5fa;--blue-bg:#111827;--green:#4ade80;--green-bg:#0f1f14;--orange:#fbbf24;--orange-bg:#1c1608;--jira:#4d9de0;--tag-bg:#2a2926;}}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;}
.header{padding:28px 32px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.eyebrow{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.02em;}
.title span{color:var(--text2);font-weight:400;}
.meta{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;}
.pill{display:flex;align-items:center;gap:6px;background:var(--tag-bg);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--text2);font-family:'DM Mono',monospace;}
.dot{width:6px;height:6px;border-radius:50%;}.dr{background:var(--red);}.db{background:var(--blue);}
.stats{display:flex;gap:12px;padding:20px 32px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 18px;flex:1;min-width:100px;}
.snum{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;line-height:1;margin-bottom:4px;}
.snum.r{color:var(--red);}.snum.b{color:var(--blue);}.snum.o{color:var(--orange);}
.slabel{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em;}
.tabs{display:flex;padding:16px 32px 0;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:10px 18px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;background:none;border-left:none;border-right:none;border-top:none;font-family:'DM Sans',sans-serif;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-bottom:2px solid var(--text);font-weight:600;}
.cnt{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10px;margin-left:6px;font-family:'DM Mono',monospace;}
.cnt.r{background:var(--red-bg);color:var(--red);}.cnt.b{background:var(--blue-bg);color:var(--blue);}
.content{padding:24px 32px;}
.panel{display:none;}.panel.active{display:block;}
.sh{display:flex;align-items:center;gap:10px;margin:20px 0 12px;}
.sl{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
.sl.r{color:var(--red);}.sl.b{color:var(--blue);}
.sc{font-family:'DM Mono',monospace;font-size:11px;padding:2px 8px;border-radius:99px;}
.sc.r{background:var(--red-bg);color:var(--red);}.sc.b{background:var(--blue-bg);color:var(--blue);}
.tw{background:var(--bg3);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:var(--bg2);border-bottom:1px solid var(--border);}
th{padding:10px 14px;text-align:left;font-family:'DM Mono',monospace;font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
td{padding:11px 14px;color:var(--text);vertical-align:top;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg2);}
.tid{font-family:'DM Mono',monospace;font-size:12px;color:var(--blue);text-decoration:none;white-space:nowrap;}
.tid:hover{text-decoration:underline;}
.sb{font-size:11px;font-family:'DM Mono',monospace;padding:2px 8px;border-radius:4px;white-space:nowrap;display:inline-block;}
.su{background:var(--red-bg);color:var(--red);}.scu{background:var(--blue-bg);color:var(--blue);}
.pb{font-size:10px;font-family:'DM Mono',monospace;padding:2px 6px;border-radius:3px;white-space:nowrap;}
.p1{background:#fde8e8;color:#b91c1c;}.p2{background:var(--orange-bg);color:var(--orange);}.p3{background:var(--blue-bg);color:var(--blue);}
.db2{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);}
.db2.old{color:var(--red);}
.st{color:var(--text2);font-size:12px;line-height:1.5;max-width:280px;}
.opener{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:10px;padding:14px 18px;margin-top:20px;display:flex;gap:12px;}
.ol{font-family:'DM Mono',monospace;font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;margin-top:2px;}
.ot{font-size:13px;color:var(--text);font-style:italic;line-height:1.6;}
.risk{background:var(--red-bg);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:10px;padding:12px 16px;margin-top:12px;display:flex;gap:10px;align-items:center;}
.rl{font-family:'DM Mono',monospace;font-size:10px;color:var(--red);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
.rt{font-size:13px;color:var(--text);}
.note{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="eyebrow">Testsigma · TAM Daily Brief</div>
    <div class="title">Pritish Samal <span>/ Monday, 10 Aug 2026</span></div>
    <div class="meta">
      <div class="pill"><span class="dot dr"></span>3 calls today</div>
      <div class="pill"><span class="dot dr"></span>11 on Us</div>
      <div class="pill"><span class="dot db"></span>0 on Customer</div>
    </div>
  </div>
</div>
<div class="stats">
  <div class="stat"><div class="snum">11</div><div class="slabel">Total Open</div></div>
  <div class="stat"><div class="snum r">11</div><div class="slabel">On Us</div></div>
  <div class="stat"><div class="snum b">0</div><div class="slabel">On Customer</div></div>
  <div class="stat"><div class="snum o">3</div><div class="slabel">Calls Today</div></div>
  <div class="stat"><div class="snum r">32</div><div class="slabel">Oldest Ticket (d)</div></div>
</div>
<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>
<script>
const customers = [{"name":"Wolken","callTime":"3:00 PM IST","tenantId":"—","onUs":3,"onCustomer":0,"gong":null,"waitingOnUs":[{"id":"00063213","sfLink":"https://testsigma.lightning.force.com/lightning/r/Case/500OX000012tacRYAQ/view","lastResponse":"Modern engine element detection and self-healing performing poorly; element identification unreliable","reporter":"Aravinda VP","jira":null,"days":6,"priority":"P2"},{"id":"00063210","sfLink":"https://testsigma.lightning.force.com/lightning/r/Case/500OX000012tAZxYAM/view","lastResponse":"POST API call fails in modern engine; link to failing test case shared","reporter":"Aravinda VP","jira":null,"days":6,"priority":"P2"},{"id":"00062968","sfLink":"https://testsigma.lightning.force.com/lightning/r/Case/500OX000012XXejYAG/view","lastResponse":"Feature request: AI-powered NLP to validate page content/structure similar to Playwright aria-snapshot","reporter":"Aravinda VP","jira":null,"days":13,"priority":"P2"}],"waitingOnCustomer":[],"jiraTickets":[],"biggestRisk":"00063213 & 00063210 — Modern engine quality issues (self-healing + POST API failures) risk customer confidence; migration from legacy engine may stall if not resolved this week","opener":"Aravinda, good to connect — I wanted to share updates on the modern engine issues you raised. Could you walk us through the specific test scenarios where self-healing is failing most often?"},{"name":"NTT DATA","callTime":"5:00 PM IST","tenantId":"—","onUs":5,"onCustomer":0,"gong":null,"waitingOnUs":[{"id":"00063428","sfLink":"https://testsigma.lightning.force.com/lightning/r/Case/500OX0000136EMEYA2/view","lastResponse":"P1 escalation case opened via chat — requires immediate review and response","reporter":"Yash Sharma","jira":null,"days":2,"priority":"P1"},{"id":"00063427","sfLink":"https://testsigma.lightning.force.com/lightning/r/Case/500OX0000135nFhYAI/view","lastResponse":"NLP step failing even though link opened correctly in new tab; recording provided for analysis","reporter":"Yash Sharma","jira":null,"days":2,"priority":"P2"},{"id":"00063187","sfLink":"https://testsigma.lightning.force.com/lightning/r/Case/500OX000012sKY8YAM/view","lastResponse":"Verification section missing from test results; customer requesting priority fix","reporter":"Yash Sharma","jira":null,"days":6,"priority":"P3"},{"id":"00063312","sfLink":"https://testsigma.lightning.force.com/lightning/r/Case/500OX000012ztpFYAQ/view","lastResponse":"Contains comparison NLP failing even when both variables hold identical data — step incorrectly marked failed","reporter":"Yash Sharma","jira":null,"days":4,"priority":"P2"},{"id":"00063389","sfLink":"https://testsigma.lightning.force.com/lightning/r/Case/500OX0000130ZWoYAM/view","lastResponse":"NLP enhancement from case 00062581 not working as expected; null runtime variable incorrectly proceeding to nested step","reporter":"Yash Sharma","jira":null,"days":4,"priority":"P3"}],"waitingOnCustomer":[],"jiraTickets":[],"biggestRisk":"00063428 P1 escalation open — combined with NLP failures (links in new tab, contains comparison, null variable) blocking test execution across multiple scenarios","opener":"Yash, thanks for joining today — I see we have a P1 open plus several NLP-related failures. Let me walk through the status on each, and please flag which ones are blocking critical test runs."},{"name":"GuidePoint Security","callTime":"8:00 PM IST","tenantId":"—","onUs":3,"onCustomer":0,"gong":null,"waitingOnUs":[{"id":"00063295","sfLink":"https://testsigma.lightning.force.com/lightning/r/Case/500OX000012y3FvYAI/view","lastResponse":"Customer requesting ability to export test cases filtered by Jira ticket from within a test run","reporter":"Kearsten Smith","jira":null,"days":5,"priority":"P2"},{"id":"00062388","sfLink":"https://testsigma.lightning.force.com/lightning/r/Case/500OX000011chdxYAA/view","lastResponse":"Cannot clone closed test runs — must recreate regression test runs from scratch every cycle","reporter":"Kearsten Smith","jira":null,"days":32,"priority":"P2"},{"id":"00062387","sfLink":"https://testsigma.lightning.force.com/lightning/r/Case/500OX000011ch9KYAQ/view","lastResponse":"Test cases linked to Jira ticket appear on every test run they belong to — unexpected behavior affects traceability","reporter":"Kearsten Smith","jira":null,"days":32,"priority":"P2"}],"waitingOnCustomer":[],"jiraTickets":[],"biggestRisk":"00062387 & 00062388 — 32 days open with no resolution; Jira linking behavior and inability to clone closed test runs are long-standing UX gaps impacting regression workflows","opener":"Kearsten, great to connect — I want to give you a clear status update on the Jira linking behavior and closed test run cloning, both open for over a month. I also have an update on the export functionality request."}];
function render(){
  const tabs=document.getElementById('tabs');
  const content=document.getElementById('content');
  customers.forEach((c,i)=>{
    const t=document.createElement('button');
    t.className='tab'+(i===0?' active':'');
    t.onclick=()=>sw(i);
    t.innerHTML=c.name+' <span class="cnt '+(c.onUs>0?'r':'b')+'">'+(c.onUs+c.onCustomer)+'</span>';
    tabs.appendChild(t);
    const p=document.createElement('div');
    p.className='panel'+(i===0?' active':'');
    p.id='p'+i;
    p.innerHTML=buildPanel(c);
    content.appendChild(p);
  });
}
function sw(i){
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',i===j));
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',i===j));
}
function buildPanel(c){
  let h='';
  if(c.waitingOnUs.length){h+=`<div class="sh"><div class="sl r">🔴 Waiting on Us</div><div class="sc r">${c.waitingOnUs.length} cases</div></div><div class="tw"><table><thead><tr><th>Ticket ID</th><th>Last Response</th><th>Reporter</th><th>Linked Jira</th><th>Days Open</th><th>Priority</th><th>Status</th></tr></thead><tbody>${c.waitingOnUs.map(t=>`<tr><td><a class="tid" href="${t.sfLink}">${t.id}</a></td><td><div class="st">${t.lastResponse}</div></td><td style="font-size:12px;white-space:nowrap;">${t.reporter}</td><td>${t.jira?`<a class="jb" href="https://testsigma.atlassian.net/browse/${t.jira}">${t.jira}</a>`:'—'}</td><td><span class="db2${t.days>30?' old':''}">${t.days}d</span></td><td><span class="pb p${t.priority.replace('P','')}">${t.priority}</span></td><td><span class="sb su">On Us</span></td></tr>`).join('')}</tbody></table></div>`;}
  if(c.waitingOnCustomer.length){h+=`<div class="sh"><div class="sl b">🔵 Waiting on Customer</div><div class="sc b">${c.waitingOnCustomer.length} cases</div></div><div class="tw"><table><thead><tr><th>Ticket ID</th><th>Last Response</th><th>Reporter</th><th>Linked Jira</th><th>Days Open</th><th>Priority</th><th>Status</th></tr></thead><tbody>${c.waitingOnCustomer.map(t=>`<tr><td><a class="tid" href="${t.sfLink}">${t.id}</a></td><td><div class="st">${t.lastResponse}</div></td><td style="font-size:12px;white-space:nowrap;">${t.reporter}</td><td>${t.jira?`<a class="jb" href="https://testsigma.atlassian.net/browse/${t.jira}">${t.jira}</a>`:'—'}</td><td><span class="db2${t.days>30?' old':''}">${t.days}d</span></td><td><span class="pb p${t.priority.replace('P','')}">${t.priority}</span></td><td><span class="sb scu">On Customer</span></td></tr>`).join('')}</tbody></table></div>`;}
  if(!c.waitingOnUs.length&&!c.waitingOnCustomer.length){h+=`<div style="padding:24px 0;color:var(--text3);font-family:'DM Mono',monospace;font-size:12px;">✓ No open Salesforce cases in the last 30 days.</div>`;}
  h+=`<div class="risk"><div class="rl">🚨 Biggest Risk</div><div class="rt">${c.biggestRisk}</div></div>`;
  h+=`<div class="opener"><div class="ol">🗣️ Open with</div><div class="ot">"${c.opener}"</div></div>`;
  h+=`<div class="note">📌 If any customer call is missing, ensure the calendar event has "Tenant ID: XXXXX" in the description or the customer company name in the event title.</div>`;
  return h;
}
render();
</script>
</body>
</html>
